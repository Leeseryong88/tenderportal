function countrySelectOptions(selected='',includeStates=false){let normalized=normalizeCountryName(selected),countries=WORLD_COUNTRY_PATHS.map(x=>`<option value="${esc(x.n)}" ${normalized===x.n?'selected':''}>${esc(mapLabel(x.n,x.ko))}</option>`).join(''),states=includeStates?`<optgroup label="${tr('United States regions')}">${US_STATE_PATHS.map(x=>`<option value="${esc(x.n)}" ${normalized===x.n?'selected':''}>${esc(mapLabel(x.n,x.ko))} (${x.c})</option>`).join('')}</optgroup>`:'';let exists=WORLD_COUNTRY_PATHS.some(x=>x.n===normalized)||includeStates&&US_STATE_PATHS.some(x=>x.n===normalized),legacy=normalized&&!exists?`<option value="${esc(normalized)}" selected>${tr('Unmapped legacy value')}: ${esc(normalized)}</option>`:'';return`<option value="">${tr('Select country')}</option>${legacy}<optgroup label="${tr('Countries')}">${countries}</optgroup>${states}`}
function coverageAvailabilityOptions(value='Direct'){return['Direct','Local Partner','Unavailable'].map(x=>`<option value="${x}" ${value===x?'selected':''}>${tr(x)}</option>`).join('')}

function availabilityForMarket(list,market){let entries=list.flatMap(s=>coverageOf(s).filter(c=>c.name===market||(US_STATE_CODE[market]&&c.name==='United States')).map(c=>({s,c})));let direct=entries.filter(x=>x.c.availability==='Direct').length,local=entries.filter(x=>x.c.availability==='Local Partner').length,unavailable=entries.filter(x=>x.c.availability==='Unavailable').length;return{entries,direct,local,unavailable,state:direct?'direct':local?'local':unavailable?'unavailable':'nodata'}}
function countryAvailability(list,country){let entries=list.flatMap(s=>coverageOf(s).filter(c=>country==='United States'?(c.name==='United States'||!!US_STATE_CODE[c.name]):c.name===country).map(c=>({s,c})));let direct=entries.filter(x=>x.c.availability==='Direct').length,local=entries.filter(x=>x.c.availability==='Local Partner').length,unavailable=entries.filter(x=>x.c.availability==='Unavailable').length;return{entries,state:direct?'direct':local?'local':unavailable?'unavailable':'nodata'}}
function mapCountryClick(country){poolFilter.country=marketCountry(country);poolFilter.region='All';render()}
function mapFill(state){return state==='direct'?'#4f8e6d':state==='local'?'#e6bd69':state==='unavailable'?'#d98179':'#e5e9e6'}
function mapLabel(name,ko){return lang==='ko'?(translations[name]||ko||name):name}
function mapDisplayName(name){let f=WORLD_COUNTRY_PATHS.find(x=>x.n===name)||US_STATE_PATHS.find(x=>x.n===name);return f?mapLabel(name,f.ko):tr(name)}
function countryViewBox(country){let f=WORLD_COUNTRY_PATHS.find(x=>x.n===country);if(!f)return'0 0 1000 500';let [x0,y0,x1,y1]=f.b,w=Math.max(x1-x0,8),h=Math.max(y1-y0,6),cx=(x0+x1)/2,cy=(y0+y1)/2;w=Math.max(w*1.7,h*3.0,18);h=Math.max(h*1.7,w/2);w=Math.max(w,h*2);return`${(cx-w/2).toFixed(1)} ${(cy-h/2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`}
function drawWorldMap(list,activeCountry){let marketNames=new Set(list.flatMap(s=>coverageOf(s).map(c=>US_STATE_CODE[c.name]?'United States':c.name)));let shapes=WORLD_COUNTRY_PATHS.map(f=>{let market=f.n==='United States'?'United States':f.n,a=countryAvailability(list,market),selected=activeCountry===market,fill=mapFill(a.state),cls=`geo-country${selected?' selected':''}`;return`<path class="${cls}" d="${f.d}" fill="${fill}" stroke="${selected?'#244b3a':'#fff'}" stroke-width="${selected?'1.7':'0.7'}" tabindex="0" role="button" aria-label="${esc(mapLabel(f.n,f.ko))}: ${a.entries.length} ${tr('vendors')}" data-map-market="${esc(market)}"><title>${esc(mapLabel(f.n,f.ko))} · ${a.entries.length} ${tr('vendors')}</title></path>`}).join('');let labels=WORLD_COUNTRY_PATHS.filter(f=>marketNames.has(f.n==='United States'?'United States':f.n)&&(f.n==='United States'?'United States':f.n)!==activeCountry).map(f=>`<text class="geo-label" x="${f.x}" y="${f.y}" text-anchor="middle">${esc(mapLabel(f.n,f.ko))}</text>`).join('');if(activeCountry){let f=WORLD_COUNTRY_PATHS.find(x=>x.n===activeCountry);if(f)labels+=`<text class="geo-label geo-label-selected" x="${f.x}" y="${f.y}" text-anchor="middle">${esc(mapLabel(f.n,f.ko))}</text>`}let view=activeCountry?countryViewBox(activeCountry):'0 0 1000 500';return`<svg class="geography-map world-geography" viewBox="${view}" role="img" aria-label="${activeCountry?`${mapDisplayName(activeCountry)}${lang==='ko'?' 협력사 커버리지 지도':' supplier coverage map'}`:tr('Global supplier coverage map')}">${shapes}${labels}</svg><div class="map-caption">${activeCountry?tr('Selected country highlighted · adjacent borders provide geographic context'):tr('World map · colored markets show supplier coverage. Select a country to focus the map.')} <span class="map-data-credit">${tr('Map data: Natural Earth')}</span></div>`}
function drawUSMap(list){let shapes=US_STATE_PATHS.map(f=>{let a=availabilityForMarket(list,f.n),selected=poolFilter.region===f.n;return`<path class="geo-state${selected?' selected':''}" d="${f.d}" fill="${mapFill(a.state)}" stroke="${selected?'#204b38':'#fff'}" stroke-width="${selected?'2.2':'1.15'}" tabindex="0" role="button" aria-label="${esc(mapLabel(f.n,f.ko))} (${f.c}) · ${a.entries.length} ${tr('vendors')}" data-map-state="${esc(f.n)}"><title>${esc(mapLabel(f.n,f.ko))} (${f.c}) · ${tr(a.state==='direct'?'Direct':a.state==='local'?'Local Partner':a.state==='unavailable'?'Unavailable':'No data')} · ${a.entries.length} ${tr('vendors')}</title></path>`}).join('');let labels=US_STATE_PATHS.map(f=>`<text class="state-code-label" x="${f.x}" y="${f.y}" text-anchor="middle" pointer-events="none">${f.c}</text>`).join('');let dc=US_STATE_PATHS.find(x=>x.c==='DC');if(dc)labels+=`<circle cx="${dc.x}" cy="${dc.y}" r="8" fill="${mapFill(availabilityForMarket(list,'District of Columbia').state)}" stroke="#fff" stroke-width="2" class="dc-marker" data-map-state="District of Columbia"><title>District of Columbia</title></circle><text class="state-code-label dc-label" x="${dc.x+13}" y="${dc.y+3}">DC</text>`;return`<svg class="geography-map us-geography" viewBox="0 0 1000 620" role="img" aria-label="United States state coverage map">${shapes}${labels}</svg><div class="map-caption">${tr('Click a state to filter suppliers by regional coverage. Alaska and Hawaii are shown in insets.')} <span class="map-data-credit">${tr('Map data: Natural Earth')}</span></div>`}
function wireSupplierMap(host){host.querySelectorAll('[data-map-market]').forEach(el=>{el.addEventListener('click',()=>mapCountryClick(el.getAttribute('data-map-market')));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();mapCountryClick(el.getAttribute('data-map-market'))}})});host.querySelectorAll('[data-map-state]').forEach(el=>{el.addEventListener('click',()=>poolFilterSet('region',el.getAttribute('data-map-state')));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();poolFilterSet('region',el.getAttribute('data-map-state'))}})})}
function drawSupplierMap(list){let host=document.querySelector('#supplierMap');if(!host)return;let isUS=poolFilter.country==='United States'||!!US_STATE_CODE[poolFilter.region];if(isUS){host.innerHTML=drawUSMap(list);wireSupplierMap(host);return}let activeCountry=poolFilter.country!=='All'?poolFilter.country:(WORLD_COUNTRY_PATHS.some(f=>f.n===poolFilter.region)?poolFilter.region:null);host.innerHTML=drawWorldMap(list,activeCountry);wireSupplierMap(host)}
function renderSuppliers(){let canManage=role==='Admin',list=poolList(),countries=[...new Set(db.suppliers.flatMap(s=>coverageOf(s).map(c=>marketCountry(c.name))))].sort(),categories=[...new Set(db.suppliers.flatMap(s=>s.categories||[]))].sort(),regions=[...new Set(db.suppliers.flatMap(s=>coverageOf(s).map(c=>c.name)))].sort(),avails=['Direct','Local Partner','Unavailable'],licenses=[...new Set(db.suppliers.map(s=>s.licenseStatus||'Not Required'))].sort();let uniqueRegions=[...new Set(list.flatMap(s=>coverageOf(s).map(c=>c.name)))].sort();let uniquePoolCountries=[...new Set(list.map(s=>s.country))].length;let directCount=list.filter(s=>coverageOf(s).some(c=>c.availability==='Direct')).length;let localCount=list.filter(s=>coverageOf(s).some(c=>c.availability==='Local Partner')).length;let expiring=list.filter(s=>s.licenseExpiry&&new Date(s.licenseExpiry)<=new Date(Date.now()+90*864e5)).length;let cards=uniqueRegions.map(region=>{let arr=list.flatMap(s=>coverageOf(s).filter(c=>c.name===region).map(c=>({s,c})));if(!arr.length)return '';let direct=arr.filter(x=>x.c.availability==='Direct').length,local=arr.filter(x=>x.c.availability==='Local Partner').length,unavailable=arr.filter(x=>x.c.availability==='Unavailable').length;return `<div class="coverage-country"><div class="coverage-country-head"><span>${esc(region)}</span><span>${arr.length}</span></div><div class="coverage-tags">${direct?`<span class="coverage-tag">${tr('Direct')} ${direct}</span>`:''}${local?`<span class="coverage-tag local">${tr('Local Partner')} ${local}</span>`:''}${unavailable?`<span class="coverage-tag none">${tr('Unavailable')} ${unavailable}</span>`:''}</div></div>`}).join('');return `${header(tr('Supplier Pool'),tr('Global supplier coverage and partner records'),canManage?`<button class="btn primary" onclick="openSupplierModal()">＋ ${tr('Add supplier')}</button>`:'')}<div class="pool-dashboard-grid"><aside class="card pool-filters"><div class="panel-title" style="margin-bottom:13px">${tr('Pool filters')}</div><div class="field"><label>${tr('Country')}</label><select onchange="poolFilterSet('country',this.value)"><option value="All">${tr('All')}</option>${countries.map(x=>`<option value="${esc(x)}" ${poolFilter.country===x?'selected':''}>${tr(x)}</option>`).join('')}</select></div><div class="field"><label>${tr('Company Type')}</label><select onchange="poolFilterSet('category',this.value)"><option value="All">${tr('All')}</option>${categories.map(x=>`<option value="${esc(x)}" ${poolFilter.category===x?'selected':''}>${tr(x)}</option>`).join('')}</select></div><div class="field"><label>${tr('Company')}</label><select onchange="poolFilterSet('vendor',this.value)"><option value="All">${tr('All')}</option>${db.suppliers.map(s=>`<option value="${esc(s.id)}" ${poolFilter.vendor===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>${tr('Region / market')}</label><select onchange="poolFilterSet('region',this.value)"><option value="All">${tr('All')}</option>${regions.map(x=>`<option value="${esc(x)}" ${poolFilter.region===x?'selected':''}>${tr(x)}</option>`).join('')}</select></div><div class="field"><label>${tr('Availability')}</label><select onchange="poolFilterSet('availability',this.value)"><option value="All">${tr('All')}</option>${avails.map(x=>`<option value="${esc(x)}" ${poolFilter.availability===x?'selected':''}>${tr(x)}</option>`).join('')}</select></div><div class="field"><label>${tr('License Status')}</label><select onchange="poolFilterSet('license',this.value)"><option value="All">${tr('All')}</option>${licenses.map(x=>`<option value="${esc(x)}" ${poolFilter.license===x?'selected':''}>${tr(x)}</option>`).join('')}</select></div><div class="field"><label>${tr('NDA status')}</label><select onchange="poolFilterSet('nda',this.value)"><option value="All">${tr('All')}</option>${['Not Checked','Not Signed','Signed','Not Required'].map(x=>`<option value="${x}" ${poolFilter.nda===x?'selected':''}>${tr(x)}</option>`).join('')}</select></div><button class="btn" style="width:100%" onclick="poolFilter={country:'All',category:'All',vendor:'All',region:'All',availability:'All',license:'All',nda:'All'};render()">↻ ${tr('Reset filters')}</button><p class="pool-tip">${tr('Pool data is shared with tender invitations.')}</p></aside><div class="pool-overview"><section class="pool-kpis"><div class="card pool-kpi"><label>${tr('Vendors in view')}</label><strong>${list.length}</strong><span class="subtle">${tr('filtered records')}</span></div><div class="card pool-kpi"><label>${tr('Countries covered')}</label><strong>${uniquePoolCountries}</strong><span class="subtle">${tr('supplier home countries')}</span></div><div class="card pool-kpi"><label>${tr('Direct coverage')}</label><strong>${directCount}</strong><span class="subtle">${tr('vendors with direct service')}</span></div><div class="card pool-kpi"><label>${tr('Renewal watch')}</label><strong>${expiring}</strong><span class="subtle">${tr('within 90 days')}</span></div></section><section class="coverage-map-card"><div class="panel-head" style="padding:0;margin-bottom:4px"><div class="panel-title">${poolFilter.country==='United States'||US_STATE_CODE[poolFilter.region]?tr('U.S. State Coverage'):poolFilter.country==='All'&&poolFilter.region==='All'?tr('Global Market Coverage'):`${mapDisplayName(poolFilter.country!=='All'?poolFilter.country:poolFilter.region)} · ${tr('Market Coverage Map')}`}</div><span class="subtle">${tr(poolFilter.country==='United States'||US_STATE_CODE[poolFilter.region]?'50 states + DC':'Country boundaries and service coverage')}</span></div><div class="panel-sub" style="padding:2px 0 12px">${tr('Click a country or U.S. state on the map to filter the supplier pool.')}</div><div class="coverage-map-wrap" id="supplierMap"></div><div class="map-legend"><span><i style="--c:#4f8e6d"></i>${tr('Direct')}</span><span><i style="--c:#e6bd69"></i>${tr('Local Partner')}</span><span><i style="--c:#d98179"></i>${tr('Unavailable')}</span><span><i style="--c:#e9edeb"></i>${tr('No data')}</span></div></section><section class="card coverage-card"><div class="panel-head" style="padding:0;margin-bottom:4px"><div class="panel-title">${tr('Service coverage')}</div><span class="subtle">${uniqueRegions.length} ${tr('markets')}</span></div><div class="panel-sub" style="padding:0 0 13px">${tr('Direct, local partner and unavailable coverage by market')}</div><div class="coverage-grid">${cards||`<div class="empty">${tr('No coverage records match your filters.')}</div>`}</div></section><section class="card pool-table-card"><div class="panel-head" style="padding:11px 3px 10px"><div class="panel-title">${tr('Supplier directory')}</div><span id="supplierDirectoryCount" class="subtle">${list.length} ${tr('companies')}</span></div><div class="pool-directory-search"><select id="poolSearchField" class="filter" aria-label="${tr('Search field')}" onchange="setPoolSearchField(this.value)"><option value="name" ${poolSearchField==='name'?'selected':''}>${tr('Company name')}</option><option value="country" ${poolSearchField==='country'?'selected':''}>${tr('Head office country')}</option><option value="type" ${poolSearchField==='type'?'selected':''}>${tr('Company type')}</option><option value="coverage" ${poolSearchField==='coverage'?'selected':''}>${tr('Service coverage')}</option><option value="availability" ${poolSearchField==='availability'?'selected':''}>${tr('Service availability')}</option><option value="license" ${poolSearchField==='license'?'selected':''}>${tr('License / qualification')}</option><option value="nda" ${poolSearchField==='nda'?'selected':''}>${tr('NDA')}</option><option value="status" ${poolSearchField==='status'?'selected':''}>${tr('Status')}</option></select><input id="poolSearchInput" class="search" value="${esc(poolSearchQuery)}" placeholder="⌕ ${tr('Search suppliers...')}" oninput="setPoolSearchQuery(this.value)"></div><div class="table-wrap"><table id="supplierTable"><thead><tr><th>${tr('COMPANY')}</th><th>${tr('COUNTRY')}</th><th>${tr('COMPANY TYPE')}</th><th>${tr('COVERAGE')}</th><th>${tr('AVAILABILITY')}</th><th>${tr('LICENSE')}</th><th>${tr('NDA')}</th><th>${tr('STATUS')}</th>${canManage?'<th></th>':''}</tr></thead><tbody>${list.map(s=>{let cv=coverageOf(s),shown=cv.slice(0,3).map(c=>`<span class="coverage-tag ${c.availability==='Local Partner'?'local':c.availability==='Unavailable'?'none':''}">${esc(c.name)}</span>`).join('');return `<tr data-name="${esc(s.name.toLowerCase())}" data-country="${esc((String(s.country||'')+' '+tr(String(s.country||''))).toLowerCase())}" data-type="${esc([...new Set([...(s.categories||[]),...(s.categories||[]).map(x=>tr(x))])].join(' ').toLowerCase())}" data-coverage="${esc(supplierMarkets(s).join(' ').toLowerCase())}" data-availability="${esc(cv.flatMap(c=>[c.availability||'',tr(c.availability||'')]).join(' ').toLowerCase())}" data-license="${esc([s.license,s.licenseStatus,tr(s.licenseStatus||'')].filter(Boolean).join(' ').toLowerCase())}" data-nda="${esc((String(s.ndaStatus||'')+' '+tr(String(s.ndaStatus||''))).toLowerCase())}" data-status="${esc((String(s.status||'Active')+' '+tr(String(s.status||'Active'))).toLowerCase())}" onclick="openSupplierDetail('${esc(s.id)}')"><td><span class="pool-record-title"><span class="company-mark">${esc(s.name.slice(0,1).toUpperCase())}</span><span><span class="primary-text">${esc(s.name)}</span><span class="secondary">${esc(s.contacts?.[0]?.name||s.contact||'—')} · ${esc(s.contacts?.[0]?.email||s.email||'')}${(s.contacts||[]).length>1?` · +${s.contacts.length-1} ${tr('contacts')}`:''}</span></span></span></td><td>${esc(s.country)}</td><td>${(s.categories||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join(' ')}</td><td><div class="coverage-cell">${shown}${cv.length>3?`<span class="pill">+${cv.length-3}</span>`:''}</div></td><td><span class="pill ${cv.some(c=>c.availability==='Direct')?'green':cv.some(c=>c.availability==='Local Partner')?'amber':'red'}"><i class="dot"></i>${tr(cv.some(c=>c.availability==='Direct')?'Direct':cv.some(c=>c.availability==='Local Partner')?'Local Partner':'Unavailable')}</span></td><td>${esc(s.license||tr(s.licenseStatus||'Not Required'))}<span class="secondary">${s.licenseExpiry?tr('Expires')+' '+esc(s.licenseExpiry):esc(s.licenseStatus||'')}</span></td><td>${ndaPill(s.ndaStatus)}</td><td>${statusPill(s.status||'Active')}</td>${canManage?`<td><button class="btn small" onclick="event.stopPropagation();openTenderModal('${esc(s.id)}')">${tr('Invite')}</button></td>`:''}</tr>`}).join('')}</tbody></table></div><div class="table-note">${tr('Select a supplier to view coverage, license and tender history.')}</div></section></div></div>`}
function openSupplierDetail(id){let s=supplier(id);if(!s)return;normalizeSupplier(s);let tenders=db.tenders.filter(t=>t.bidders.includes(id)),cov=coverageOf(s),contacts=s.contacts||[];let body=`<div class="detail-box"><div class="detail-row"><span>${tr('Country / city')}</span><b>${esc(s.city||'—')}, ${esc(s.country)}</b></div><div class="detail-row"><span>${tr('Company type')}</span><b>${(s.categories||[]).map(esc).join(', ')}</b></div><div class="detail-row"><span>${tr('Website')}</span><b>${esc(s.website||'—')}</b></div><div class="detail-row"><span>${tr('NDA status')}</span>${ndaPill(s.ndaStatus)}</div><div class="detail-row"><span>${tr('NDA signed date')}</span><b>${esc(s.ndaSignedDate||'—')}</b></div></div><div class="detail-box"><b>${tr('Market contacts')}</b>${contacts.length?contacts.map(c=>`<div class="contact-detail"><b>${esc(c.name||'—')}</b><span>${esc([c.city,c.country].filter(Boolean).join(', ')||tr('Market not specified'))}</span><a href="mailto:${esc(c.email||'')}">${esc(c.email||'—')}</a><span>${esc(c.phone||'—')}</span></div>`).join(''):`<div class="subtle" style="padding:8px 0">${tr('No contact records yet.')}</div>`}</div><div class="detail-box"><b>${tr('Regional coverage')}</b>${cov.map(c=>`<div class="detail-row"><span>${esc(c.name)}</span><span class="pill ${c.availability==='Direct'?'green':c.availability==='Local Partner'?'amber':'red'}">${tr(c.availability)}</span></div>`).join('')}</div><div class="detail-box"><b>${tr('License and qualification')}</b><div class="detail-row"><span>${tr('License number / method')}</span><b>${esc(s.license||'—')}</b></div><div class="detail-row"><span>${tr('License status')}</span><b>${tr(s.licenseStatus||'Not Required')}</b></div><div class="detail-row"><span>${tr('Expiry date')}</span><b>${esc(s.licenseExpiry||'—')}</b></div></div>${role==='Admin'?`<div class="detail-box"><b>${tr('Tender history')}</b>${tenders.length?tenders.map(t=>`<div class="detail-row"><span>${esc(t.name)}</span>${statusPill(t.status)}</div>`).join(''):`<div class="subtle" style="padding:8px 0">${tr('No tender invitations yet.')}</div>`}</div>`:''}${role==='Admin'?`<div class="pool-detail-actions"><button type="button" class="btn" onclick="closeModal();openSupplierModal('${esc(id)}')">${tr('Edit supplier')}</button><button type="button" class="btn primary" onclick="closeModal();openTenderModal('${esc(id)}')">${tr('Invite to tender')}</button></div>`:''}`;modal(esc(s.name),`${esc(s.id)} · ${tr('Supplier profile')}`,body,e=>{e.preventDefault();closeModal()},tr('Close'));let c=document.querySelector('#modalForm .modal-actions .btn.primary');if(c){c.type='button';c.onclick=closeModal}}
function supplierContactRow(c={}){return`<div class="supplier-contact-row"><select name="contactCountry" aria-label="${tr('Country / market')}">${countrySelectOptions(c.country)}</select><input name="contactCity" placeholder="${tr('City')}" value="${esc(c.city||'')}"><input name="contactName" placeholder="${tr('Contact name')}" value="${esc(c.name||'')}"><input name="contactEmail" type="email" placeholder="${tr('Email')}" value="${esc(c.email||'')}"><input name="contactPhone" type="tel" placeholder="${tr('Phone')}" value="${esc(c.phone||'')}"><button type="button" class="btn small contact-remove" title="${tr('Remove contact')}" onclick="removeSupplierContact(this)">×</button></div>`}
function addSupplierContact(){let host=document.querySelector('#supplierContactRows');host?.insertAdjacentHTML('beforeend',supplierContactRow())}function removeSupplierContact(btn){btn.closest('.supplier-contact-row')?.remove()}
function supplierCoverageRow(c={}){let market=normalizeCountryName(c.name||'');return`<div class="coverage-editor-row"><select name="coverageMarket" required aria-label="${tr('Service coverage country or region')}" onchange="renderCoveragePreview(this.value)">${countrySelectOptions(market,true)}</select><select name="coverageAvailability" aria-label="${tr('Service availability')}">${coverageAvailabilityOptions(normalizeAvailability(c.availability))}</select><button type="button" class="btn small contact-remove" title="${tr('Remove coverage')}" onclick="removeSupplierCoverage(this)">×</button></div>`}
function addSupplierCoverage(){let host=document.querySelector('#supplierCoverageRows');host?.insertAdjacentHTML('beforeend',supplierCoverageRow());renderCoveragePreview()}
function removeSupplierCoverage(btn){btn.closest('.coverage-editor-row')?.remove();if(!document.querySelector('#supplierCoverageRows .coverage-editor-row'))addSupplierCoverage();else renderCoveragePreview()}

function openTenderDetail(id){let t=db.tenders.find(x=>x.id===id);if(!t)return;activeTender=id;let invite=t.bidders.map(id=>`<div class="detail-row"><span>${esc(supplier(id)?.name||id)}</span><span>${t.submissions?.[id]?'✓ Submitted':'Invitation pending'}</span></div>`).join('');modal(esc(t.name),`${t.id} · ${esc(project(t.project)?.name||'')}`,`<div class="detail-box"><div class="detail-row"><span>Status</span>${statusPill(t.status)}</div><div class="detail-row"><span>Deadline</span><b>${date(t.deadline,t.zone)}</b></div><div class="detail-row"><span>Type</span><b>${esc(t.type)}</b></div><div class="detail-row"><span>Required documents</span><b>${esc(t.required||'—')}</b></div></div><div class="detail-box"><b style="font-size:12px">${tr('Procurement schedule')}</b><div class="milestone-list">${TENDER_MILESTONES.map(stage=>{let item=t.schedule?.[stage.key]||{date:'',status:''};return`<div class="milestone-item"><b>${tr(stage.label)}</b><small>${item.status==='na'?tr('Not applicable'):item.date?esc(item.date):tr('Blank')}</small><span>${item.status==='na'?tr('Not applicable'):item.date?tr('Planned'):'—'}</span></div>`}).join('')}</div><small class="subtle">${tr('Time zone')}: ${esc(t.zone||'UTC')} · ${timeZoneOffsetLabel(t.zone||'UTC')}</small></div><div class="panel-head"><b>Invited suppliers</b><span class="subtle">${t.bidders.length} bidders</span></div>${invite}<div class="detail-box"><b style="font-size:12px">Tender documents</b><div id="adminDocList">${(db.files[t.id]?.admin||[]).map((f,i)=>`<div class="detail-row"><span>${esc(f.name)}</span><button type="button" class="btn small" onclick="downloadFile('${t.id}','admin',${i})">↓ Download</button></div>`).join('')||'<div class="subtle" style="padding-top:9px">No tender files uploaded yet.</div>'}</div><div class="upload-zone" style="margin-top:12px"><input type="file" id="tenderFiles" multiple onchange="uploadTenderFiles('${t.id}',this.files)"><div>Upload RFP, drawings or supporting materials</div></div></div><div class="link-box"><input id="inviteLink" readonly value="${location.origin}${location.pathname}?invite=${t.id}&supplier={supplierId}"><button type="button" class="btn" onclick="copyInvite('${t.id}')">Copy invite link</button></div><div class="notice">Preview links work inside this browser demo. Production invitations must require authenticated supplier accounts and server verified access.</div>`,e=>{e.preventDefault();closeModal()},'Close');document.querySelector('#modalForm .modal-actions .btn.primary').type='button';document.querySelector('#modalForm .modal-actions .btn.primary').onclick=()=>closeModal()}
function copyInvite(id){navigator.clipboard?.writeText(`${location.origin}${location.pathname}?invite=${id}&supplier={supplierId}`).then(()=>toast('Invite link copied')).catch(()=>toast('Select and copy the invite link'))}
function uploadTenderFiles(id,files){if(!files.length)return;db.files[id]??={};db.files[id].admin??=[];[...files].forEach(f=>{let reader=new FileReader();reader.onload=()=>{db.files[id].admin.push({name:f.name,type:f.type,data:reader.result});db.tenders.find(t=>t.id===id).files=db.files[id].admin.length;save();openTenderDetail(id);toast('Tender documents uploaded')};reader.readAsDataURL(f)})}
function downloadFile(tid,owner,index){let f=db.files[tid]?.[owner]?.[index];if(!f)return;let a=document.createElement('a');a.href=f.data;a.download=f.name;a.click()}
function openSupplierTender(id){let t=db.tenders.find(x=>x.id===id);if(!t)return;activeTender=id;let ownfiles=db.files[t.id]?.[currentSupplier]||[];refreshTenderStatuses();let isSubmitted=!!t.submissions?.[currentSupplier],closed=!['Open','Receiving'].includes(t.status)||Date.now()>=Date.parse(t.deadline);modal(esc(t.name),`${t.id} · ${esc(project(t.project)?.name||'')}`,`<div class="detail-box"><div class="detail-row"><span>Submission deadline</span><b>${date(t.deadline,t.zone)}</b></div><div class="detail-row"><span>Status</span>${statusPill(t.status)}</div><div class="detail-row"><span>Required documents</span><b>${esc(t.required||'Proposal')}</b></div></div><div class="detail-box"><b style="font-size:12px">Tender documents</b>${(db.files[t.id]?.admin||[]).map((f,i)=>`<div class="detail-row"><span>${esc(f.name)}</span><button type="button" class="btn small" onclick="downloadFile('${t.id}','admin',${i})">↓ Download</button></div>`).join('')||'<div class="subtle" style="padding:10px 0">No files shared.</div>'}</div>${isSubmitted?`<div class="notice">Your submission was received on ${date(t.submittedAt?.[currentSupplier]||new Date().toISOString(),t.zone)}. You may submit updated files before the deadline.</div>`:''}${closed?'<div class="notice" style="background:#fff7ed;border-color:#f1dfc2;color:#8e6830">This tender is closed. New submissions are disabled.</div>':`<div class="field"><label>Upload proposal and quotation files *</label><div class="upload-zone"><input id="submissionFiles" type="file" multiple><div>Choose files from your device</div></div><div class="subtle" style="margin-top:8px">Files are submitted together. Demo file size limit: 15 MB per file.</div></div>`}${ownfiles.length?`<div class="detail-box"><b style="font-size:12px">Your submitted files</b>${ownfiles.map(f=>`<div class="detail-row"><span>${esc(f.name)}</span><span class="subtle">Uploaded</span></div>`).join('')}</div>`:''}`,e=>{e.preventDefault();if(closed){closeModal();return}let input=document.querySelector('#submissionFiles');if(!input.files.length){toast('Select one or more files to submit');return}for(let f of input.files)if(f.size>15*1024*1024){toast('File exceeds the 15 MB demo limit');return}let arr=[];[...input.files].forEach(f=>{let r=new FileReader();r.onload=()=>{arr.push({name:f.name,type:f.type,data:r.result});if(arr.length===input.files.length){db.files[t.id]??={};db.files[t.id][currentSupplier]=arr; t.submissions??={};t.submissions[currentSupplier]=1;t.submittedAt??={};t.submittedAt[currentSupplier]=new Date().toISOString();t.status='Receiving';refreshTenderStatuses();save();closeModal();render();toast('Submission received successfully')}};r.readAsDataURL(f)})},isSubmitted?'Resubmit files':'Submit proposal');if(closed){document.querySelector('#modalForm .modal-actions .btn.primary').textContent='Close';document.querySelector('#modalForm .modal-actions .btn.primary').onclick=closeModal;document.querySelector('#modalForm .modal-actions .btn.primary').type='button'}}
function openInviteFromQuery(){let q=new URLSearchParams(location.search),id=q.get('invite'),sid=q.get('supplier');if(!id||!sid)return;let t=db.tenders.find(x=>x.id===id);refreshTenderStatuses();if(!t||!['Open','Receiving'].includes(t.status)||!t.bidders.includes(sid)){toast('This invitation is not available for this supplier');return}role='Supplier';currentSupplier=sid;document.querySelector('#roleSelect').value='Supplier';db.view='tenders';render();setTimeout(()=>openSupplierTender(id),50)}
init();openInviteFromQuery();
</script></body></html>
